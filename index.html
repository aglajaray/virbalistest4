<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Virbalis AR – Testas Nr. 4</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#status{position:fixed;z-index:1000;top:16px;left:50%;transform:translateX(-50%);
max-width:88vw;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.65);
color:#fff;font:14px Arial,sans-serif;text-align:center;pointer-events:none;transition:opacity .4s}
#start{position:fixed;z-index:1001;left:50%;bottom:28px;transform:translateX(-50%);
border:0;border-radius:24px;padding:13px 20px;font-size:16px;background:#fff;color:#111}
</style>
</head>
<body>
<div id="status">Paspausk „Pradėti“ ir nukreipk kamerą į virtuvę.</div>
<button id="start">Pradėti</button>
<audio id="memory" src="./memory.mp3" preload="auto" loop></audio>

<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; autoStart:true; filterMinCF:0.001; filterBeta:0.01; missTolerance:18; warmupTolerance:5;"
 color-space="sRGB"
 renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true"
 vr-mode-ui="enabled:false"
 device-orientation-permission-ui="enabled:false">

<a-assets>
<img id="bodyTex" src="./body.png">
<img id="wingTex" src="./wing.png">
<img id="mouthTex" src="./mouth.png">
<img id="openEyeTex" src="./open_eye.png">
<img id="closedEyeTex" src="./closed_eye.png">
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="target" mindar-image-target="targetIndex:0">
<a-entity id="characterGroup" position="0.08 -0.30 0.08" scale="0.62 0.62 0.62" visible="false">

<a-image src="#bodyTex" position="0 0 0" width="1.45" height="1.45"
 material="shader:flat;transparent:true;alphaTest:0.02;side:double"></a-image>

<a-entity id="wingPivot" position="-0.105 0.405 0.012">
<a-image src="#wingTex" position="0.105 -0.405 0" width="1.45" height="1.45"
 material="shader:flat;transparent:true;alphaTest:0.02;side:double"></a-image>
</a-entity>

<!-- Apatinio snapo sukimosi taškas. mouth.png išlaiko visą 2048x2048 canvas. -->
<a-entity id="mouthPivot" position="-0.405 0.155 0.020">
<a-image src="#mouthTex" position="0.405 -0.155 0" width="1.45" height="1.45"
 material="shader:flat;transparent:true;alphaTest:0.02;side:double"></a-image>
</a-entity>

<a-image id="openEye" src="#openEyeTex" position="0 0 0.026" width="1.45" height="1.45"
 material="shader:flat;transparent:true;alphaTest:0.02;side:double"></a-image>
<a-image id="closedEye" src="#closedEyeTex" position="0 0 0.028" width="1.45" height="1.45"
 visible="false" material="shader:flat;transparent:true;alphaTest:0.02;side:double"></a-image>

</a-entity>
</a-entity>
</a-scene>

<script>
const target=document.querySelector('#target');
const group=document.querySelector('#characterGroup');
const wingPivot=document.querySelector('#wingPivot');
const mouthPivot=document.querySelector('#mouthPivot');
const openEye=document.querySelector('#openEye');
const closedEye=document.querySelector('#closedEye');
const start=document.querySelector('#start');
const status=document.querySelector('#status');
const sound=document.querySelector('#memory');

let unlocked=false, found=false, raf=null, t0=0;
let audioCtx=null, analyser=null, sourceNode=null, dataArray=null;
let blinkTimer=null;

function setupAudioAnalysis(){
  if(audioCtx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  audioCtx=new AC();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=256;
  analyser.smoothingTimeConstant=0.42;
  dataArray=new Uint8Array(analyser.frequencyBinCount);
  sourceNode=audioCtx.createMediaElementSource(sound);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function scheduleBlink(){
  clearTimeout(blinkTimer);
  const delay=2200+Math.random()*3200;
  blinkTimer=setTimeout(()=>{
    if(!found){scheduleBlink();return;}
    openEye.setAttribute('visible','false');
    closedEye.setAttribute('visible','true');
    setTimeout(()=>{
      closedEye.setAttribute('visible','false');
      openEye.setAttribute('visible','true');
      if(found)scheduleBlink();
    },145);
  },delay);
}

start.addEventListener('click',async()=>{
  try{
    setupAudioAnalysis();
    if(audioCtx.state==='suspended') await audioCtx.resume();
    sound.volume=0;
    await sound.play();
    sound.pause();
    sound.currentTime=0;
    sound.volume=0.8;
    unlocked=true;
  }catch(e){}
  start.style.display='none';
  status.textContent='Lėtai nukreipk kamerą į centrinę virtuvės dalį.';
});

function animate(ts){
  if(!found)return;
  if(!t0)t0=ts;
  const t=(ts-t0)/1000;

  const wingAngle=-1.5+Math.sin(t*(Math.PI*2/3.4))*5+
                  Math.sin(t*(Math.PI*2/7.1))*1.2;
  wingPivot.object3D.rotation.z=THREE.MathUtils.degToRad(wingAngle);

  /*
    SNAPAS:
    Snapas juda labai subtiliai pagal garsą.
    Uždaryta = 0°, maksimalus pravėrimas = 20°.
    Taip apatinė dalis lieka arti kūno ir vos kilnojasi aukštyn/žemyn.
  */
  let mouthAngle=0;
  if(analyser && !sound.paused){
    analyser.getByteTimeDomainData(dataArray);
    let sum=0;
    for(let i=0;i<dataArray.length;i++){
      const x=(dataArray[i]-128)/128;
      sum+=x*x;
    }
    const rms=Math.sqrt(sum/dataArray.length);

    // Sustiprinta jautra kalbai. Tylos metu snapas lieka ties 6 val.
    let level=(rms-0.008)/0.10;
    level=Math.max(0,Math.min(1,level));

    // Kad net tyliau kalbant judėjimas būtų aiškiai matomas.
    level=Math.pow(level,0.65);
    mouthAngle=level*20;
  }

  mouthPivot.object3D.rotation.z=THREE.MathUtils.degToRad(mouthAngle);
  raf=requestAnimationFrame(animate);
}

target.addEventListener('targetFound',async()=>{
  found=true;
  group.setAttribute('visible','true');
  status.style.opacity='1';
  status.textContent='✓ Virtuvė atpažinta — personažas aktyvuotas';
  if(unlocked){
    try{
      if(audioCtx && audioCtx.state==='suspended')await audioCtx.resume();
      await sound.play();
    }catch(e){}
  }
  cancelAnimationFrame(raf);
  t0=0;
  raf=requestAnimationFrame(animate);
  scheduleBlink();
  setTimeout(()=>status.style.opacity='0',1800);
});

target.addEventListener('targetLost',()=>{
  found=false;
  cancelAnimationFrame(raf);
  clearTimeout(blinkTimer);
  sound.pause();
  wingPivot.object3D.rotation.z=0;
  mouthPivot.object3D.rotation.z=0;
  closedEye.setAttribute('visible','false');
  openEye.setAttribute('visible','true');
  status.style.opacity='1';
  status.textContent='Virtuvės vaizdas pamestas — grįžk prie fotografavimo kampo.';
});
</script>
</body>
</html>
