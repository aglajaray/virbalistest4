<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Virbalis AR – Testas Nr. 4</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    #status{position:fixed;z-index:1000;top:16px;left:50%;transform:translateX(-50%);
      max-width:88vw;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.65);
      color:#fff;font:14px Arial,sans-serif;text-align:center;pointer-events:none}
    #start{position:fixed;z-index:1001;left:50%;bottom:28px;transform:translateX(-50%);
      border:0;border-radius:24px;padding:13px 20px;font-size:16px;background:#fff;color:#111}
  </style>
</head>
<body>
<div id="status">Padėk Testo Nr. 3 markerį ten, kur nori matyti personažą (~4 m nuo savęs), tada spausk „Pradėti“.</div>
<button id="start">Pradėti</button>
<audio id="memory" src="./memory.mp3" preload="auto" loop></audio>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 12; warmupTolerance: 5;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="bodyTex" src="./character.png">
    <img id="wingTex" src="./wing.png">
    <img id="mouthTex" src="./mouth.png">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex:0">
    <!-- Personažas stovi markerio vietoje. Markerį fiziškai padėk ~4 m nuo žiūrovo. -->
    <a-entity id="characterGroup" position="0 0.72 0.02" scale="1.55 1.55 1.55">

      <a-image src="#bodyTex" position="0 0 0" width="1.45" height="1.45"
        material="shader:flat; transparent:true; alphaTest:0.02; side:double"></a-image>

      <!-- Sparno kopija juda labai subtiliai virš originalaus piešinio. -->
      <a-image id="wing" src="#wingTex" position="0 0 0.012" width="1.45" height="1.45"
        material="shader:flat; transparent:true; alphaTest:0.02; side:double"
        animation="property:rotation; from:0 0 -1.5; to:0 0 2.5; dir:alternate; dur:1800; loop:true; easing:easeInOutSine">
      </a-image>

      <!-- Snapo/burnos sluoksnis: nedidelis pravėrimo/kalbėjimo judesys. -->
      <a-image id="mouth" src="#mouthTex" position="0 0 0.018" width="1.45" height="1.45"
        material="shader:flat; transparent:true; alphaTest:0.02; side:double"
        animation="property:rotation; from:0 0 0; to:0 0 -1.8; dir:alternate; dur:360; loop:true; easing:easeInOutSine">
      </a-image>

    </a-entity>
  </a-entity>
</a-scene>

<script>
const target = document.querySelector('#target');
const start = document.querySelector('#start');
const status = document.querySelector('#status');
const sound = document.querySelector('#memory');
const mouth = document.querySelector('#mouth');
let unlocked=false;

start.addEventListener('click', async()=>{
  try{
    sound.volume=0;
    await sound.play();
    sound.pause();
    sound.currentTime=0;
    sound.volume=0.8;
    unlocked=true;
  }catch(e){}
  start.style.display='none';
  status.textContent='Nukreipk kamerą į markerį virtuvėje.';
});

target.addEventListener('targetFound', async()=>{
  status.textContent='✓ Personažas aptiktas';
  if(unlocked){ try{ await sound.play(); }catch(e){} }
  mouth.setAttribute('animation','enabled',true);
  setTimeout(()=>status.style.opacity='0',1800);
});

target.addEventListener('targetLost',()=>{
  sound.pause();
  status.style.opacity='1';
  status.textContent='Markeris pamestas — nukreipk kamerą atgal į jo vietą.';
});
</script>
</body>
</html>
