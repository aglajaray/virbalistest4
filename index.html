<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Virbalis AR – Testas Nr. 4: animuotas personažas</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#status{
  position:fixed;z-index:1000;top:16px;left:50%;transform:translateX(-50%);
  max-width:88vw;padding:10px 14px;border-radius:18px;
  background:rgba(0,0,0,.65);color:#fff;font:14px Arial,sans-serif;
  text-align:center;pointer-events:none;transition:opacity .4s
}
#start{
  position:fixed;z-index:1001;left:50%;bottom:28px;transform:translateX(-50%);
  border:0;border-radius:24px;padding:13px 20px;font-size:16px;
  background:#fff;color:#111
}
</style>
</head>

<body>
<div id="status">Paspausk „Pradėti“ ir nukreipk kamerą į virtuvę iš fotografavimo vietos.</div>
<button id="start">Pradėti</button>
<audio id="memory" src="./memory.mp3" preload="auto" loop></audio>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart:true; filterMinCF:0.001; filterBeta:0.01; missTolerance:18; warmupTolerance:5;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true; alpha:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-assets>
    <img id="bodyTex" src="./body.png">
    <img id="wingTex" src="./wing.png">
    <img id="mouthTex" src="./mouth.png">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex:0">

    <!-- Pozicija ir dydis iš jau sėkmingo virtuvės testo -->
    <a-entity id="characterGroup"
      position="0.08 -0.30 0.08"
      scale="0.62 0.62 0.62"
      visible="false">

      <!-- Visi PNG yra vienodo 2048x2048 canvas, todėl tiksliai persidengia. -->
      <a-image id="body"
        src="#bodyTex"
        position="0 0 0"
        width="1.45" height="1.45"
        material="shader:flat;transparent:true;alphaTest:0.02;side:double">
      </a-image>

      <!-- Sparno PIVOT.
           Pivot pastumtas prie sparno šaknies, o pats PNG kompensuojamas atgal.
           Taip sukamas ne visas paveikslas apie centrą, o sparnas apie prisitvirtinimo zoną. -->
      <a-entity id="wingPivot" position="-0.105 0.405 0.012">
        <a-image id="wing"
          src="#wingTex"
          position="0.105 -0.405 0"
          width="1.45" height="1.45"
          material="shader:flat;transparent:true;alphaTest:0.02;side:double">
        </a-image>
      </a-entity>

      <!-- Burnos/snapo PIVOT prie jo prisitvirtinimo prie galvos. -->
      <a-entity id="mouthPivot" position="-0.48 0.345 0.020">
        <a-image id="mouth"
          src="#mouthTex"
          position="0.48 -0.345 0"
          width="1.45" height="1.45"
          material="shader:flat;transparent:true;alphaTest:0.02;side:double">
        </a-image>
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
const target = document.querySelector('#target');
const group = document.querySelector('#characterGroup');
const wingPivot = document.querySelector('#wingPivot');
const mouthPivot = document.querySelector('#mouthPivot');
const start = document.querySelector('#start');
const status = document.querySelector('#status');
const sound = document.querySelector('#memory');

let unlocked = false;
let found = false;
let raf = null;
let t0 = 0;

start.addEventListener('click', async () => {
  try {
    sound.volume = 0;
    await sound.play();
    sound.pause();
    sound.currentTime = 0;
    sound.volume = 0.8;
    unlocked = true;
  } catch(e) {}
  start.style.display = 'none';
  status.textContent = 'Lėtai nukreipk kamerą į centrinę virtuvės dalį.';
});

function animate(ts) {
  if (!found) return;
  if (!t0) t0 = ts;
  const t = (ts - t0) / 1000;

  // SPARNAS:
  // lėtas, organiškas mostas maždaug kas 3.4 s.
  // Kampas specialiai nedidelis, kad iliustracija neatrodytų mechaniškai.
  const wingAngle =
    -1.5 +
    Math.sin(t * (Math.PI * 2 / 3.4)) * 5.0 +
    Math.sin(t * (Math.PI * 2 / 7.1)) * 1.2;

  wingPivot.object3D.rotation.z = THREE.MathUtils.degToRad(wingAngle);

  // BURNA / SNAPAS:
  // juda tik kai garsas groja.
  // Dviejų sinusų kombinacija sukuria nereguliaresnį „kalbėjimą“.
  let mouthAngle = 0;
  if (!sound.paused) {
    const talk =
      Math.max(0, Math.sin(t * 11.0)) * 0.65 +
      Math.max(0, Math.sin(t * 17.3 + 0.8)) * 0.35;
    mouthAngle = -7.0 * talk;
  }

  mouthPivot.object3D.rotation.z = THREE.MathUtils.degToRad(mouthAngle);

  raf = requestAnimationFrame(animate);
}

target.addEventListener('targetFound', async () => {
  found = true;
  group.setAttribute('visible', 'true');

  status.style.opacity = '1';
  status.textContent = '✓ Virtuvė atpažinta — personažas aktyvuotas';

  if (unlocked) {
    try { await sound.play(); } catch(e) {}
  }

  cancelAnimationFrame(raf);
  t0 = 0;
  raf = requestAnimationFrame(animate);

  setTimeout(() => status.style.opacity = '0', 2000);
});

target.addEventListener('targetLost', () => {
  found = false;
  cancelAnimationFrame(raf);
  sound.pause();

  // Grąžiname dalis į neutralią padėtį.
  wingPivot.object3D.rotation.z = 0;
  mouthPivot.object3D.rotation.z = 0;

  status.style.opacity = '1';
  status.textContent = 'Virtuvės vaizdas pamestas — grįžk prie panašaus fotografavimo kampo.';
});
</script>
</body>
</html>
